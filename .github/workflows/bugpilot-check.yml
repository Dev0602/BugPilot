name: BugPilot CI

on:
  push:
    branches:
      - main
      - bugpilot-improvements

  pull_request:

  workflow_dispatch:

jobs:
  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python source
        run: |
          python -m py_compile \
            backend/app/config.py \
            backend/app/agent.py \
            backend/app/api.py \
            backend/app/db.py \
            backend/app/tools.py \
            evaluation/internal/baseline.py \
            scripts/reset_bugs.py \
            evaluation/internal/run_bugpilot.py

      - name: Run Python test suite
        run: |
          python -m pytest tests -q


  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend tests
        env:
          CI: true
        run: npm test -- --watchAll=false

      - name: Build frontend
        env:
          CI: true
        run: npm run build


  docker-sandbox:
    name: Docker Sandbox
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build BugPilot sandbox image
        run: |
          docker build \
            -t bugpilot-sandbox \
            .

      - name: Verify sandbox user
        run: |
          docker run \
            --rm \
            bugpilot-sandbox \
            id

      - name: Verify hardened dependency sandbox
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory

          from backend.app.agent import run_tests


          with TemporaryDirectory() as temp_dir:
              root = Path(temp_dir)
              root.chmod(0o755)

              (root / "requirements.txt").write_text(
                  "python-slugify==8.0.4\n",
                  encoding="utf-8",
              )

              (root / "app.py").write_text(
                  """
          from slugify import slugify

          def make_slug(text):
              return slugify(text)
          """.strip() + "\n",
                  encoding="utf-8",
              )

              (root / "test_app.py").write_text(
                  """
          from app import make_slug

          def test_make_slug():
              assert make_slug(
                  "Hello BugPilot World"
              ) == "hello-bugpilot-world"
          """.strip() + "\n",
                  encoding="utf-8",
              )

              passed, logs, coverage = run_tests(
                  str(root)
              )

              print(logs)
              print("PASSED:", passed)
              print("COVERAGE:", coverage)

              if not passed:
                  raise SystemExit(
                      "Sandbox smoke test failed."
                  )

          print(
              "DEPENDENCY SANDBOX "
              "SMOKE TEST PASSED"
          )
          PY